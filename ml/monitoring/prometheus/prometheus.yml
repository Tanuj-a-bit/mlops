global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'recommendation-api'
    static_configs:
      - targets: ['localhost:8081']
        labels:
          service: 'recommendation-system'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s
